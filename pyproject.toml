[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "big-whale-penny-tracker"
version = "0.1.0"
description = "ROTD (Runner of the Day): surfaces the few sub-$10 US stocks most likely to be an explosive runner, as early as the evidence allows"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Big Whale Penny Tracker" }]
dependencies = [
    "requests>=2.31",
    "exchange_calendars>=4.5",
    "tzdata>=2024.1; platform_system == 'Windows'",
]

[project.optional-dependencies]
dev = ["pytest>=7.4"]
news = ["yfinance>=0.2"]
fit = ["scikit-learn>=1.3", "numpy>=1.26"]

[project.scripts]
rotd = "rotd.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
rotd = ["prompts/*.md", "sources/fixtures/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
filterwarnings = ["ignore::DeprecationWarning"]
